<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Düfte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Duftgarderobe</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    --bg: #f6f1ea; --flaeche: #fcfaf6; --text: #2b2420; --leise: #887b70; --linie: #e4dacd; --glas: rgba(246,241,234,.78);
    --schatten: 0 22px 44px -28px rgba(60, 40, 25, .5);
    --serif: "Cormorant Garamond", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "Jost", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
    --karte: 210px;
    color-scheme: light;
  }
  :root[data-dunkel] {
    --bg: #131110; --flaeche: #1c1816; --text: #f1eae0; --leise: #a0958a; --linie: #2e2723; --glas: rgba(19,17,16,.78);
    --schatten: 0 22px 44px -24px rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
  :root[data-karte="klein"] { --karte: 160px; }
  :root[data-karte="gross"] { --karte: 280px; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 300 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    transition: background-color .5s ease, color .5s ease;
  }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }

  .seite { max-width: 1280px; margin: 0 auto; padding: 0 max(28px, env(safe-area-inset-right)) 80px max(28px, env(safe-area-inset-left)); }

  /* ── Kopf ──────────────────────────────────────── */
  .kopf { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-top: max(52px, calc(env(safe-area-inset-top) + 28px)); margin-bottom: 26px; animation: auftauchen 1s ease both; }
  .eyebrow { font: 500 .7rem/1 var(--sans); letter-spacing: .38em; text-transform: uppercase; color: var(--leise); margin: 0 0 14px; }
  h1 { font: 300 clamp(3rem, 7vw, 5.6rem)/.95 var(--serif); margin: 0; letter-spacing: -.012em; }
  .unterzeile { margin: 12px 0 0; color: var(--leise); font: italic 400 1.2rem/1.3 var(--serif); }
  .symbole { display: flex; gap: 10px; }
  .rund { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--linie); background: transparent; display: grid; place-items: center; cursor: pointer; text-decoration: none; transition: border-color .3s, transform .4s ease; }
  .rund:hover { border-color: var(--leise); }
  .rund svg { width: 19px; height: 19px; }
  #thema:hover { transform: rotate(-20deg); }
  .mond { display: none; }
  :root[data-dunkel] .sonne { display: none; }
  :root[data-dunkel] .mond { display: block; }

  /* ── Werkzeugleiste ────────────────────────────── */
  .werkzeuge {
    position: sticky; top: 0; z-index: 5; margin: 0 -14px 34px; padding: 12px 14px;
    display: grid; grid-template-columns: minmax(180px, 280px) 1fr auto; gap: 12px; align-items: center;
    background: var(--glas); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    border-bottom: 1px solid transparent; transition: border-color .3s; animation: auftauchen 1s ease .12s both;
  }
  .werkzeuge.geklebt { border-bottom-color: var(--linie); }
  .suche { position: relative; }
  .suche svg { position: absolute; left: 13px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--leise); }
  .suche input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px; border: 1px solid var(--linie); background: var(--flaeche); font-size: .9rem; }
  .suche input:focus { outline: none; border-color: var(--leise); }
  .filter { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .filter::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px; border: 1px solid var(--linie); background: transparent;
    font-size: .8rem; letter-spacing: .05em; cursor: pointer; transition: background-color .3s, color .3s, border-color .3s;
  }
  .chip:hover { border-color: var(--leise); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip .punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--farbe, var(--leise)); }
  .chip .zahl { font-size: .68rem; opacity: .55; }
  .sortierung { padding: 9px 12px; border-radius: 999px; border: 1px solid var(--linie); background: var(--flaeche); font-size: .82rem; }

  /* ── Raster ────────────────────────────────────── */
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--karte), 1fr)); gap: 46px 28px; }
  .karte { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; animation: auftauchen .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms + 150ms); }
  .karte-bild { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 6px; background: linear-gradient(160deg, color-mix(in srgb, var(--akzent) 40%, var(--flaeche)), var(--akzent)); box-shadow: var(--schatten); }
  .karte-bild img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transform: scale(1.02); transition: opacity .8s ease, transform 1.4s cubic-bezier(.2,.7,.2,1); }
  .karte-bild img.geladen { opacity: 1; }
  .karte:hover .karte-bild img, .karte:focus-visible .karte-bild img { transform: scale(1.06); }
  .karte-bild::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); pointer-events: none; }
  .abzeichen { position: absolute; left: 10px; top: 10px; padding: 4px 9px; border-radius: 999px; font: 500 .62rem/1.2 var(--sans); letter-spacing: .14em;
    background: rgba(255,255,255,.22); color: #fff; border: 1px solid rgba(255,255,255,.3); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .karte:focus-visible { outline: none; }
  .karte:focus-visible .karte-bild { outline: 2px solid var(--text); outline-offset: 4px; }
  .karte-marke { margin: 18px 0 5px; font: 500 .64rem/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--leise); }
  .karte-name { margin: 0; font: 400 1.65rem/1.08 var(--serif); }
  .karte-familie { margin: 7px 0 0; display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--leise); }
  .karte-familie .punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--akzent); }
  .leer { grid-column: 1 / -1; text-align: center; color: var(--leise); font: italic 1.4rem var(--serif); padding: 60px 0; }
  footer { margin-top: 90px; text-align: center; color: var(--leise); font-size: .8rem; letter-spacing: .04em; }
  footer a { text-underline-offset: 3px; }

  /* ── Detail ────────────────────────────────────── */
  dialog {
    width: min(1080px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 0; border-radius: 10px; overflow: auto;
    background: var(--flaeche); color: var(--text); box-shadow: 0 40px 100px -30px rgba(0,0,0,.6);
  }
  dialog[open] { animation: detailEin .5s cubic-bezier(.2,.7,.2,1); }
  dialog.schliesst { animation: detailAus .28s ease forwards; }
  dialog::backdrop { background: rgba(20,15,12,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .detail { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.1fr); min-height: min(720px, calc(100dvh - 28px)); }
  .detail-bild { position: relative; background: var(--akzent); overflow: hidden; }
  .detail-bild img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: langsamZoom 18s ease-out both; }
  .detail-text { padding: 52px 50px 40px; position: relative; display: flex; flex-direction: column; }
  .oben-rechts { position: absolute; top: 14px; right: 14px; display: flex; gap: 4px; }
  .oben-rechts button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; color: var(--leise); font-size: 22px; line-height: 1; }
  .oben-rechts button:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
  .detail .eyebrow { margin-bottom: 12px; }
  .detail h2 { font: 300 clamp(2.4rem, 5vw, 3.8rem)/1 var(--serif); margin: 0; }
  .beschreibung { font: italic 400 1.22rem/1.45 var(--serif); color: var(--leise); margin: 16px 0 22px; max-width: 36ch; }
  .etiketten { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .etikett { padding: 6px 12px; border: 1px solid var(--linie); border-radius: 999px; font-size: .78rem; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 7px; }
  .etikett .punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--akzent); }
  .abschnitt { font: 500 .62rem/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--leise); margin: 0 0 12px; }
  .pyramide { display: grid; gap: 10px; margin: 0 0 28px; }
  .stufe { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: start; }
  .stufe-name { display: flex; align-items: center; gap: 8px; font: 500 .62rem/1.6 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--leise); padding-top: 4px; }
  .stufe-name i { width: 12px; height: 2px; background: var(--akzent); opacity: .7; }
  .noten { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { padding: 4px 11px; border-radius: 999px; background: color-mix(in srgb, var(--akzent) 12%, transparent); font: 400 1.05rem/1.4 var(--serif); }
  .temperatur { margin: 0 0 28px; }
  .skala { position: relative; height: 8px; border-radius: 999px; background: linear-gradient(to right, #7fa7d6, #b9d0cf 40%, #f0d38f 70%, #e59a63); opacity: .45; }
  .bereich { position: absolute; top: -3px; height: 14px; border-radius: 999px; background: var(--akzent); box-shadow: 0 0 0 3px var(--flaeche), 0 4px 10px -2px rgba(0,0,0,.3); }
  .skala-text { display: flex; justify-content: space-between; font-size: .72rem; color: var(--leise); margin-top: 8px; }
  .fakten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin: 0 0 30px; font-size: .9rem; }
  .fakten dt { font: 500 .6rem/1 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--leise); margin-bottom: 6px; }
  .fakten dd { margin: 0; }
  .aktionen { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; }
  .knopf {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 24px; border-radius: 999px; text-decoration: none;
    font: 400 .8rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--text); transition: transform .25s ease, background-color .3s, color .3s;
  }
  .knopf:active { transform: scale(.97); }
  .knopf.primaer { background: var(--text); color: var(--bg); }
  .knopf.sekundaer:hover { background: var(--text); color: var(--bg); }
  .hinweis { margin: 12px 0 0; font-size: .76rem; color: var(--leise); }

  @keyframes auftauchen { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes detailEin { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes detailAus { to { opacity: 0; transform: translateY(16px) scale(.98); } }
  @keyframes langsamZoom { from { transform: scale(1.08); } to { transform: scale(1); } }

  @media (max-width: 820px) {
    .werkzeuge { grid-template-columns: 1fr auto; }
    .filter { grid-column: 1 / -1; grid-row: 2; }
    .detail { grid-template-columns: 1fr; min-height: 0; }
    .detail-bild { aspect-ratio: 4 / 3; }
    .detail-text { padding: 34px 24px 28px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="seite">
  <header class="kopf">
    <div>
      <p class="eyebrow">Meine Sammlung</p>
      <h1>Duftgarderobe</h1>
      <p class="unterzeile" id="unterzeile">&nbsp;</p>
    </div>
    <div class="symbole">
      <a class="rund" href="einstellungen.html" aria-label="Einstellungen" title="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
      <button class="rund" id="thema" type="button" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel">
        <svg class="sonne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="mond" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="werkzeuge" id="werkzeuge">
    <label class="suche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="suche" placeholder="Name, Marke oder Note …" aria-label="Sammlung durchsuchen">
    </label>
    <nav class="filter" id="filter" aria-label="Nach Duftfamilie filtern"></nav>
    <select class="sortierung" id="sortierung" aria-label="Reihenfolge">
      <option value="sammlung">Wie in der Datei</option>
      <option value="name">Name</option>
      <option value="marke">Marke</option>
      <option value="familie">Duftfamilie</option>
    </select>
  </div>

  <main class="raster" id="raster" aria-live="polite"></main>

  <footer><a href="einstellungen.html">Einstellungen</a> · <a href="preview.html">Widget-Vorschau (PC)</a></footer>
</div>

<dialog id="detail" aria-labelledby="detailName"><div class="detail" id="detailInhalt"></div></dialog>

<script src="js/gemeinsam.js"></script>
<script src="js/einstellungen.js"></script>
<script>
"use strict";
const SKRIPT_NAME = "DuftDesTages";   // Name des Skripts in Scriptable
const { el, FAMILIEN, KONZENTRATIONEN, familienName, jahreszeitName } = Duft;
const $ = s => document.querySelector(s);
const E = DuftEinstellungen.laden();
let duefte = [], aktiverFilter = "alle", suchtext = "", offen = null;

// ── Darstellung aus den Einstellungen ───────────────────────
const systemDunkel = matchMedia("(prefers-color-scheme: dark)");
function themaAnwenden() {
  const t = E["galerie.thema"];
  document.documentElement.toggleAttribute("data-dunkel", t === "dunkel" || (t === "system" && systemDunkel.matches));
}
themaAnwenden();
systemDunkel.addEventListener?.("change", themaAnwenden);
document.documentElement.dataset.karte = E["galerie.kartengroesse"];
$("#thema").addEventListener("click", () => {
  E["galerie.thema"] = document.documentElement.hasAttribute("data-dunkel") ? "hell" : "dunkel";
  DuftEinstellungen.speichern(E);
  themaAnwenden();
});
$("#sortierung").value = E["galerie.sortierung"];
$("#sortierung").addEventListener("change", e => {
  E["galerie.sortierung"] = e.target.value;
  DuftEinstellungen.speichern(E);
  mitUebergang(rasterZeichnen);
});

// ── Hilfen ──────────────────────────────────────────────────
const scriptableLink = id => `scriptable:///run/${encodeURIComponent(SKRIPT_NAME)}?action=set&id=${encodeURIComponent(id)}`;
const sprayLink = id => `spray.html?id=${encodeURIComponent(id)}`;
function mitUebergang(fn) {
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(fn);
  else fn();
}
const normal = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function sichtbareDuefte() {
  const q = normal(suchtext);
  let liste = duefte.filter(d => aktiverFilter === "alle" || d.duftfamilie === aktiverFilter);
  if (q) {
    liste = liste.filter(d => normal([d.name, d.marke, familienName(d.duftfamilie), ...(d.kopfnoten || []), ...(d.herznoten || []), ...(d.basisnoten || []), ...(d.anlass || [])].join(" ")).includes(q));
  }
  const nach = E["galerie.sortierung"];
  const reihenfolge = Object.keys(FAMILIEN);
  if (nach === "name") liste = [...liste].sort((a, b) => a.name.localeCompare(b.name, "de"));
  if (nach === "marke") liste = [...liste].sort((a, b) => (a.marke || "").localeCompare(b.marke || "", "de") || a.name.localeCompare(b.name, "de"));
  if (nach === "familie") liste = [...liste].sort((a, b) => reihenfolge.indexOf(a.duftfamilie) - reihenfolge.indexOf(b.duftfamilie) || a.name.localeCompare(b.name, "de"));
  return liste;
}

// ── Filter ──────────────────────────────────────────────────
function filterZeichnen() {
  const zaehler = {};
  for (const d of duefte) zaehler[d.duftfamilie] = (zaehler[d.duftfamilie] || 0) + 1;
  const familien = [...Object.keys(FAMILIEN).filter(f => zaehler[f]), ...Object.keys(zaehler).filter(f => !FAMILIEN[f])];
  const chip = (schluessel, name, anzahl, farbe) => el("button", {
    class: "chip", type: "button", "aria-pressed": String(schluessel === aktiverFilter), style: farbe ? `--farbe:${farbe}` : null,
    onclick: () => { aktiverFilter = schluessel; filterZeichnen(); mitUebergang(rasterZeichnen); },
  }, farbe ? el("span", { class: "punkt" }) : null, name, el("span", { class: "zahl" }, String(anzahl)));
  $("#filter").replaceChildren(chip("alle", "Alle", duefte.length), ...familien.map(f => chip(f, familienName(f), zaehler[f], FAMILIEN[f] && FAMILIEN[f].farbe)));
}

// ── Raster ──────────────────────────────────────────────────
function rasterZeichnen() {
  const liste = sichtbareDuefte();
  if (!liste.length) { $("#raster").replaceChildren(el("p", { class: "leer" }, suchtext ? `Nichts gefunden für „${suchtext}“.` : "Keine Düfte in dieser Familie.")); return; }
  $("#raster").replaceChildren(...liste.map((d, i) => {
    const img = el("img", { alt: "", loading: i < 8 ? "eager" : "lazy", decoding: "async" });
    img.addEventListener("load", () => img.classList.add("geladen"));
    img.addEventListener("error", () => img.remove());
    img.src = d.bild;
    return el("button", {
      class: "karte", type: "button", "aria-label": `${d.name} von ${d.marke}`,
      style: `--akzent:${d.farbe}; --i:${i}; view-transition-name: karte-${d.id}`,
      onclick: () => detailOeffnen(d),
    },
      el("div", { class: "karte-bild" }, img, d.konzentration ? el("span", { class: "abzeichen" }, d.konzentration) : null),
      el("p", { class: "karte-marke" }, d.marke),
      el("h2", { class: "karte-name" }, d.name),
      el("p", { class: "karte-familie" }, el("span", { class: "punkt" }), familienName(d.duftfamilie)));
  }));
}

// ── Detail ──────────────────────────────────────────────────
const dialog = $("#detail");

function temperaturSkala(t) {
  const MIN = -10, MAX = 40, pos = v => ((Math.min(MAX, Math.max(MIN, v)) - MIN) / (MAX - MIN)) * 100;
  return el("div", { class: "temperatur" },
    el("p", { class: "abschnitt" }, `Temperatur · ${t.min} bis ${t.max} °C`),
    el("div", { class: "skala" }),
    el("div", { style: "position:relative; height:0" }, el("div", { class: "bereich", style: `left:${pos(t.min)}%; width:${Math.max(2, pos(t.max) - pos(t.min))}%; top:-11px` })),
    el("div", { class: "skala-text" }, el("span", {}, `${MIN} °C`), el("span", {}, "15 °C"), el("span", {}, `${MAX} °C`)));
}

function detailOeffnen(d) {
  offen = d;
  const stufe = (titel, liste) => el("div", { class: "stufe" },
    el("div", { class: "stufe-name" }, el("i"), titel),
    el("div", { class: "noten" }, ...(liste || []).map(n => el("span", { class: "note" }, n))));
  const fakt = (titel, wert) => el("div", {}, el("dt", {}, titel), el("dd", {}, wert));
  const bild = el("img", { alt: `${d.name} – Produktbild`, src: d.bild });
  bild.addEventListener("error", () => bild.remove());
  const blaettern = schritt => {
    const liste = sichtbareDuefte(), i = liste.findIndex(x => x.id === d.id);
    if (liste.length > 1) detailOeffnen(liste[(i + schritt + liste.length) % liste.length]);
  };

  $("#detailInhalt").replaceChildren(
    el("div", { class: "detail-bild" }, bild),
    el("div", { class: "detail-text" },
      el("div", { class: "oben-rechts" },
        el("button", { type: "button", "aria-label": "Vorheriger Duft", onclick: () => blaettern(-1) }, "‹"),
        el("button", { type: "button", "aria-label": "Nächster Duft", onclick: () => blaettern(1) }, "›"),
        el("button", { type: "button", "aria-label": "Schließen", onclick: detailSchliessen }, "×")),
      el("p", { class: "eyebrow" }, [d.marke, KONZENTRATIONEN[d.konzentration] || d.konzentration].filter(Boolean).join(" · ")),
      el("h2", { id: "detailName" }, d.name),
      d.beschreibung ? el("p", { class: "beschreibung" }, d.beschreibung) : el("div", { style: "height:22px" }),
      el("div", { class: "etiketten" },
        el("span", { class: "etikett" }, el("span", { class: "punkt" }), familienName(d.duftfamilie)),
        ...(d.jahreszeiten || []).map(j => el("span", { class: "etikett" }, jahreszeitName(j))),
        ...(d.anlass || []).map(a => el("span", { class: "etikett" }, a))),
      el("p", { class: "abschnitt" }, "Duftpyramide"),
      el("div", { class: "pyramide" }, stufe("Kopf", d.kopfnoten), stufe("Herz", d.herznoten), stufe("Basis", d.basisnoten)),
      d.temperaturbereich ? temperaturSkala(d.temperaturbereich) : null,
      el("div", { class: "aktionen" },
        el("a", { class: "knopf primaer", href: scriptableLink(d.id) }, "Als Duft des Tages"),
        el("a", { class: "knopf sekundaer", href: sprayLink(d.id) }, "Sprühen ansehen")),
      el("p", { class: "hinweis" }, "„Als Duft des Tages“ öffnet Scriptable auf deinem iPad.")));
  dialog.style.setProperty("--akzent", d.farbe);
  dialog.classList.remove("schliesst");
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
  history.replaceState(null, "", `#${encodeURIComponent(d.id)}`);
}

function detailSchliessen() {
  if (!dialog.open) return;
  offen = null;
  dialog.classList.add("schliesst");
  setTimeout(() => { dialog.close(); dialog.classList.remove("schliesst"); }, 260);
  history.replaceState(null, "", location.pathname + location.search);
}
dialog.addEventListener("click", e => { if (e.target === dialog) detailSchliessen(); });
dialog.addEventListener("cancel", e => { e.preventDefault(); detailSchliessen(); });
document.addEventListener("keydown", e => {
  if (!offen) return;
  if (e.key === "ArrowRight") dialog.querySelector('[aria-label="Nächster Duft"]').click();
  if (e.key === "ArrowLeft") dialog.querySelector('[aria-label="Vorheriger Duft"]').click();
});

// Werkzeugleiste bekommt beim Scrollen eine Linie
new IntersectionObserver(([e]) => $("#werkzeuge").classList.toggle("geklebt", e.intersectionRatio < 1), { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe($("#werkzeuge"));

let suchTimer;
$("#suche").addEventListener("input", e => {
  clearTimeout(suchTimer);
  suchTimer = setTimeout(() => { suchtext = e.target.value.trim(); rasterZeichnen(); }, 120);
});

// ── Start ───────────────────────────────────────────────────
(async () => {
  try {
    duefte = await Duft.duefteLaden();
  } catch (e) {
    $("#raster").replaceChildren(el("p", { class: "leer" }, "Die Sammlung konnte nicht geladen werden."));
    console.error(e);
    return;
  }
  const marken = new Set(duefte.map(d => d.marke)).size;
  $("#unterzeile").textContent = `${duefte.length} Düfte von ${marken} Marken`;
  filterZeichnen();
  rasterZeichnen();
  const ausHash = duefte.find(d => d.id === decodeURIComponent(location.hash.slice(1)));
  if (ausHash) detailOeffnen(ausHash);
})();

// Service Worker nur online (GitHub Pages) – lokal würde er beim Entwickeln alte Dateien ausliefern
if ("serviceWorker" in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service Worker:", e));
}
</script>
</body>
</html>
